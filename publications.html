<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--accent:#C8A96E;--bg:#141414;--bg2:#1C1C1C;--border:rgba(200,169,110,0.2);--muted:#888;--text:#E8E4DC}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(20,20,20,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;flex-wrap:wrap}
  .nav-brand{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent);font-weight:700}
  .nav-links{display:flex;flex-wrap:wrap;gap:16px}
  .nav-links a{color:var(--muted);font-size:13px;text-decoration:none}
  .nav-links a:hover,.nav-links a.active{color:var(--accent)}
  .page-header{height:200px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;margin-top:60px}
  .page-header h1{font-size:48px;font-family:'Playfair Display',serif;color:var(--accent)}
  .container{max-width:1000px;margin:0 auto;padding:0 24px}
  section{padding:60px 0}
  .pub-filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .pub-filter{padding:8px 20px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
  .pub-filter.active{border-color:var(--accent);background:rgba(200,169,110,0.15);color:var(--accent)}
  .pub-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .pub-badge{font-size:11px;padding:2px 10px;border-radius:20px;display:inline-block;margin-bottom:8px}
  .pub-badge.journal{background:rgba(200,169,110,0.15);color:var(--accent)}
  .pub-badge.conference{background:rgba(100,160,255,0.2);color:#6aa0f8}
  .pub-title{font-size:16px;font-weight:600;margin-bottom:6px}
  .pub-venue{font-size:13px;color:var(--accent);margin-bottom:4px}
  .pub-authors{font-size:12px;color:var(--muted);margin-bottom:6px}
  .pub-doi a{font-size:12px;color:var(--accent);text-decoration:none}
  footer{text-align:center;padding:32px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  @media(max-width:700px){.nav-links{gap:10px}.nav-links a{font-size:11px}}
</style>

</section></div>

<script>
const pubs=[{type:"journal",title:"Multifunctional Inks in Aerosol Jet Printing: Performance, Challenges, and Applications",venue:"Frontiers in Manufacturing Technology, 2025",authors:"Elsersawy R., Rahman A., Zaman C.S.U., and Khondoker M.A.H.",doi:"10.3389/fmtec.2025.1558209"},{type:"journal",title:"Structural Analysis and Fatigue Prediction of Harrow Tines Used in Canadian Prairies",venue:"Discover Applied Science, 2024",authors:"Rahman A., and Khondoker M.A.H.",doi:"10.1007/s42452-024-06310-5"},{type:"journal",title:"3D Printed Cathodes for Microbial Electrolysis Cell-Assisted Anaerobic Digester",venue:"Journal of Power Sources, 2024",authors:"Chung T.H., Rahman A., Zakaria B.H., Khondoker M.A.H., Dhar B.R.",doi:"10.1016/j.jpowsour.2024.235461"},{type:"journal",title:"Effect of Treatment Methods on Material Properties and Performance of Sawdust-Concrete and Sawdust-Polymer Composites",venue:"Polymers, 2024",authors:"Rahman A., Khondoker M.A.H.",doi:"10.3390/polym16"},{type:"journal",title:"Numerical Investigation on Life Cycle Assessment of Proposed Harrow Tine Models",venue:"Engineering Research Express, 2024",authors:"Rahman A., Fasih S., Kabir G., and Khondoker M.A.H.",doi:"10.1088/2631-8695/adae59"},{type:"journal",title:"Optimization Strategies to Improve Transformer Tank Strength using Computational Analysis",venue:"Applied Mechanics, 2024",authors:"Hasan M., Rahman A., Islam A., Khondoker M.A.H.",doi:"10.3390/applmech5040039"},{type:"journal",title:"Numerical Investigation of Aerodynamic Characteristic of Hyperloop System",venue:"IJAME, 2023",authors:"Roy P.C., Rahman A., and Halder M.R.",doi:"10.15282/ijame.19.4.2022.10.0784"},{type:"journal",title:"Controlling Degree of Foaming in Extrusion 3D Printing of Porous Polylactic Acid",venue:"Rapid Prototyping Journal, 2023",authors:"Dinakaran I., Sakib-Uz-Zaman C., Rahman A. and Khondoker M.A.H.",doi:"10.1108/RPJ-02-2023-0044"},{type:"journal",title:"Fabrication and Performance Investigation of Natural-Glass Fiber Hybrid Laminated Composites",venue:"Journal of Natural Fibers, 2023",authors:"Rahman A., Hasib M.A., Islam M.A., Alam I. and Chanda S.",doi:"10.1080/15440478.2022.2143981"},{type:"conference",title:"Numerical Approach on Fatigue Life Prediction of Harrow Tines Considering Geometrical Variations",venue:"ICIMP 2024, Regina, Canada",authors:"Rahman A., Khondoker M.A.H.",doi:"10.3390/engproc2024076075"},{type:"conference",title:"Sustainable Bicycle Crank Arm Selection Using Life Cycle Analysis",venue:"ICIMP 2024, Regina, Canada",authors:"Rahman A., Wadud M.A., Hasib M.A., and Islam M.A.",doi:"10.3390/engproc2024076043"},{type:"conference",title:"Parametric Study on Cellular Negative Stiffness Honeycomb Meta-Structures",venue:"ICIMP 2024, Regina, Canada",authors:"Chanda S., Hasib A., Rahman A., and Wadud M.A.",doi:"10.3390/engproc2024076051"}];
function renderPubs(type){const container=document.getElementById('pub-list');const filtered=type==='all'?pubs:pubs.filter(p=>p.type===type);container.innerHTML=filtered.map(p=>`<div class="pub-item"><div><span class="pub-badge ${p.type}">${p.type==='journal'?'Journal Article':'Conference Paper'}</span><div class="pub-title">${p.title}</div><div class="pub-venue">${p.venue}</div><div class="pub-authors">${p.authors}</div><div class="pub-doi"><a href="https://doi.org/${p.doi}" target="_blank">doi.org/${p.doi}</a></div></div></div>`).join('');}
function filterPubs(type){document.querySelectorAll('.pub-filter').forEach(btn=>btn.classList.remove('active'));event.target.classList.add('active');renderPubs(type);}
renderPubs('all');
</script>
